# Builds everything an author needs to install, on GitHub's machines, and attaches it to a Release:
#   - Windows installer (.msi and setup .exe)
#   - Android APK (signed with your keystore if the secrets exist, otherwise with a throwaway CI key)
#   - the server image on GHCR (ghcr.io/<owner>/<repo>) for the cloud host
# Trigger: push a tag like v0.1.0, or run it by hand from the Actions tab.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Novel Workbench ${{ github.ref_name }}"
          releaseBody: "Windows: run the .exe (SmartScreen will ask once; choose More info → Run anyway). Android: install the .apk. Server image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Generate the Android project
        env: { NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018 }
        run: npx tauri android init --ci
      - name: Build APK
        env: { NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018 }
        run: npx tauri android build --apk --ci
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/34.0.0
          UNSIGNED=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk | head -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-upload}"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key (updates need an uninstall first)."
            keytool -genkeypair -v -keystore /tmp/release.jks -alias ci -keyalg RSA -keysize 2048 -validity 10000 -storepass cipass -keypass cipass -dname "CN=Novel Workbench CI"
            PASS=cipass; ALIAS=ci
          fi
          $BT/zipalign -p 4 "$UNSIGNED" /tmp/aligned.apk
          $BT/apksigner sign --ks /tmp/release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out "novel-workbench-${GITHUB_REF_NAME}-android.apk" /tmp/aligned.apk
          $BT/apksigner verify "novel-workbench-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: "*.apk" }
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          for i in 1 2 3 4 5 6; do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Novel Workbench $GITHUB_REF_NAME" --notes "Android: install the .apk. Windows installer is attached by the windows job."
          gh release upload "$GITHUB_REF_NAME" *.apk --clobber

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
