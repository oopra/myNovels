# Builds everything an author needs to install, on GitHub's machines, and attaches it to a Release:
#   - Windows installer (.msi and setup .exe)
#   - Android APK (signed with your keystore if the secrets exist, otherwise with a throwaway CI key)
#   - the server image on GHCR (ghcr.io/<owner>/<repo>) for the cloud host
# Trigger: every push to main (the release is named v<version> from package.json and updated in place),
# a tag like v0.1.0, or by hand from the Actions tab. Bump "version" in package.json to cut a new release.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # The release every job attaches to: the tag when one was pushed, else v<package.json version>.
  RELEASE_TAG: ""

permissions:
  contents: write
  packages: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV";
          else echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The desktop shell only needs the web UI; skip native builds (better-sqlite3, keytar) that belong to the server.
      - run: npm ci --ignore-scripts
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Novel Workbench ${{ env.RELEASE_TAG }}"
          releaseBody: "Windows: run the .exe (SmartScreen will ask once; choose More info → Run anyway). Android: install the .apk. Server image: ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV";
          else echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Point at the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Generate the Android project
        run: npx tauri android init --ci
      - name: Build APK
        run: npx tauri android build --apk --ci
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/34.0.0
          UNSIGNED=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk | head -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-upload}"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key (updates need an uninstall first)."
            keytool -genkeypair -v -keystore /tmp/release.jks -alias ci -keyalg RSA -keysize 2048 -validity 10000 -storepass cipass -keypass cipass -dname "CN=Novel Workbench CI"
            PASS=cipass; ALIAS=ci
          fi
          $BT/zipalign -p 4 "$UNSIGNED" /tmp/aligned.apk
          $BT/apksigner sign --ks /tmp/release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --out "novel-workbench-${RELEASE_TAG}-android.apk" /tmp/aligned.apk
          $BT/apksigner verify "novel-workbench-${RELEASE_TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "*.apk"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do gh release view "$RELEASE_TAG" >/dev/null 2>&1 && break; sleep 20; done
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Novel Workbench $RELEASE_TAG" --notes "Android: install the .apk. Windows: run the setup .exe. Server image: ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" *.apk --clobber

  server-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV";
          else echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
