[package]
name = "novel-workbench"
version = "0.1.0"
description = "Novel Workbench native shell: wraps the workbench UI and talks to your workbench server"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "novel_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
